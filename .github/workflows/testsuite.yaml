name: GuideOS deterministic tests
on:
  pull_request:
  push:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: guideos_ci
          POSTGRES_USER: testsuite
          POSTGRES_PASSWORD: ci-tests-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U testsuite -d guideos_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GUIDEOS_TESTSUITE_DATABASE_URL: postgresql://testsuite:ci-tests-only@localhost:5432/guideos_ci
      GUIDEOS_TEST_POSTGRES_URL: postgresql://testsuite:ci-tests-only@localhost:5432/guideos_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv sync --frozen
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync pytest -q
      - name: REST scenarios with persistent evidence
        if: always()
        run: uv run --no-sync python -m testsuite.runner --report html
      - name: Export persisted run evidence
        if: always()
        run: |
          uv run --no-sync python - <<'PY'
          import json, os
          from pathlib import Path
          from testsuite.postgres import PostgresRepository
          repo = PostgresRepository(os.environ['GUIDEOS_TESTSUITE_DATABASE_URL'])
          directory = Path('.guideos/testsuite')
          directory.mkdir(parents=True, exist_ok=True)
          for run in repo.runs():
              (directory / (run['id'] + '.json')).write_text(json.dumps(repo.read(run['id']), ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deterministic-test-evidence
          path: .guideos/testsuite/
          retention-days: 90
          include-hidden-files: true

  docker:
    runs-on: ubuntu-latest
    needs: [tests]
    steps:
      - uses: actions/checkout@v4
      - name: Deterministic scenarios in the isolated Compose stack
        run: |
          export GUIDEOS_TESTSUITE_GIT_COMMIT=$(git rev-parse HEAD)
          export GUIDEOS_TESTSUITE_GIT_BRANCH=${GITHUB_REF_NAME}
          export GUIDEOS_TESTSUITE_GIT_DIRTY=false
          docker compose -f compose.testsuite.yaml up --build --abort-on-container-exit --exit-code-from runner
      - name: Tear down the stack
        if: always()
        run: docker compose -f compose.testsuite.yaml down -v
      - name: Build the API and app images
        run: docker build --target api -t guideos-api-ci . && docker build --target app -t guideos-app-ci .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-test-reports
          path: .guideos/testsuite-docker/
          retention-days: 90
          include-hidden-files: true
