[project]
name = "guideos"
version = "0.1.0"
description = "Domänenneutraler Assessment- und Beratungskern: deterministische Regeln, Wissensbasis und LLM-Unterstützung"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.138.1",
    "pydantic>=2,<3",
    "psycopg[binary]>=3.2,<4",
    "streamlit",
    "uvicorn>=0.49.0",
    "httpx>=0.28.1",
    "pypdf>=6.19.0",
    "fastmcp>=4.1,<5",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "pytest",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
